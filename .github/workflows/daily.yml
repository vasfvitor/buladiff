name: Atualizar arquivo e publicar site

# Dois gatilhos: push em main (dados coletados localmente) publica; o cron diário tenta coletar no
# runner e publica de qualquer jeito. A API da ANVISA (Cloudflare) costuma bloquear runners do GitHub;
# nesse caso a coleta é pulada com aviso e o site sai do data/ commitado.
on:
  push:
    branches: [main]
    paths: ["data/**", "site/**", "src/**", "registros.txt", ".github/workflows/daily.yml"]
  schedule:
    - cron: "0 9 * * *" # 06h em Brasília
  workflow_dispatch:
    inputs:
      pular_coleta:
        description: "Só exportar e publicar (não consultar a ANVISA)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  coletar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get install -y --no-install-recommends poppler-utils
      - run: uv sync --extra tables

      - name: Testar acesso à API da ANVISA
        id: api
        if: ${{ !inputs.pular_coleta }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 \
            -H 'Authorization: Guest' -H 'Referer: https://consultas.anvisa.gov.br/' \
            -H 'User-Agent: Mozilla/5.0 (X11; Linux x86_64) Chrome/128.0' \
            'https://consultas.anvisa.gov.br/api/consulta/bulario?count=1&page=1&filter%5BnumeroRegistro%5D=118190404' || true)
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::API da ANVISA respondeu '$code' a partir do runner; coleta pulada. Rode scripts/coleta-local.sh na sua máquina."
          fi

      - name: Feed e lista curada
        if: ${{ steps.api.outputs.ok == 'true' }}
        run: |
          uv run bulario feed --baixar
          uv run bulario fetch --curados

      - name: Commitar dados
        if: ${{ steps.api.outputs.ok == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "Arquivo: $(date -u +%Y-%m-%d)"; git push; }

  publicar:
    needs: coletar
    if: always() && (needs.coletar.result == 'success' || needs.coletar.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv run bulario export --out site/src/data
      - name: Build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          SITE_BASE: /${{ github.event.repository.name }}
        run: pnpm -C site build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deploy
        uses: actions/deploy-pages@v4
