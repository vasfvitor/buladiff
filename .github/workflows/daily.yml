name: Atualizar arquivo e publicar site

# Dois gatilhos: push em main (dados coletados localmente) publica; o cron diário tenta coletar no
# runner e publica de qualquer jeito. A API da ANVISA (Cloudflare) costuma bloquear runners do GitHub;
# nesse caso a coleta é pulada com aviso e o site sai do data/ commitado.
on:
  push:
    branches: [main]
    paths: ["data/**", "site/**", "src/**", "registros.txt", ".github/workflows/daily.yml"]
  schedule:
    - cron: "0 9 * * *" # 06h em Brasília
  workflow_dispatch:
    inputs:
      pular_coleta:
        description: "Só exportar e publicar (não consultar a ANVISA)"
        type: boolean
        default: false

# Menor privilégio: nada por padrão; cada job pede só o escopo que usa.
permissions: {}

concurrency:
  group: daily
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  coletar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # único job que commita e empurra data/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # este job empurra o commit de dados

      # Primeiro passo: sem acesso à API não vale instalar nada.
      - name: Testar acesso à API da ANVISA
        id: api
        if: ${{ !inputs.pular_coleta }}
        timeout-minutes: 2
        env:
          # Em env, nunca interpolado direto no shell.
          API_URL: "https://consultas.anvisa.gov.br/api/consulta/bulario?count=1&page=1&filter%5BnumeroRegistro%5D=118190404"
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 \
            -H 'Authorization: Guest' -H 'Referer: https://consultas.anvisa.gov.br/' \
            -H 'User-Agent: Mozilla/5.0 (X11; Linux x86_64) Chrome/128.0' \
            "$API_URL" || true)
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::API da ANVISA respondeu '$code' a partir do runner; coleta pulada. Rode scripts/coleta-local.sh na sua máquina."
          fi

      - name: Instalar uv
        if: ${{ steps.api.outputs.ok == 'true' }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Dependências de sistema (poppler)
        if: ${{ steps.api.outputs.ok == 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Sincronizar dependências
        if: ${{ steps.api.outputs.ok == 'true' }}
        run: uv sync --locked --extra tables

      - name: Feed e lista curada
        if: ${{ steps.api.outputs.ok == 'true' }}
        run: |
          uv run bulario feed --baixar
          uv run bulario fetch --curados

      - name: Commitar dados
        if: ${{ steps.api.outputs.ok == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "Arquivo: $(date -u +%Y-%m-%d)"; git push; }

  publicar:
    needs: coletar
    if: always() && (needs.coletar.result == 'success' || needs.coletar.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # só lê o repositório
      pages: write # publica no GitHub Pages
      id-token: write # OIDC exigido por deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false # este job não empurra nada

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Depois do pnpm: `cache: pnpm` precisa do pnpm no PATH.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - run: uv run bulario export --out site/src/data

      - name: Build
        env:
          # configure-pages já sabe origem e subcaminho (inclusive domínio próprio);
          # o fallback mantém o comportamento antigo se os outputs vierem vazios.
          SITE_URL: ${{ steps.pages.outputs.origin || format('https://{0}.github.io', github.repository_owner) }}
          SITE_BASE: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}
        run: pnpm -C site build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
